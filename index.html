<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validador de Bandeira de Cartão</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="card-checker">
    <h1>Validador de Bandeira de Cartão</h1>
    <input type="text" id="cardNumber" placeholder="Digite o número do cartão" />
    <div class="buttons">
      <button onclick="checkCard()">Verificar</button>
      <button onclick="clearFields()">Limpar</button>
    </div>
    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
